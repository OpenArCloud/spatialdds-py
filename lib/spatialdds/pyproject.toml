[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialdds"
version = "0.6.0"
description = "SpatialDDS over plain HTTPS and a WebSocket: a client for the web binding (Appendix N), and the reference registry behind one command."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Open AR Cloud" }]
keywords = ["spatialdds", "spatial", "geopose", "anchors", "registry", "openarcloud"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: GIS",
]
# Two, and no more, for reading and publishing. The wire is HTTP and a
# WebSocket; anything else would be this library's opinion rather than the
# binding's requirement.
dependencies = ["requests>=2.25", "websockets>=12"]

[project.optional-dependencies]
# Being an endpoint is the part you opt into. aiohttp serves it, mcap is the
# format a registry's state lives in, and jsonschema validates every published
# body against the vendored schemas before it reaches the wire. That last one
# is not optional in any useful sense: without it the write surface refuses
# every publish with a 500 rather than accept something unvalidated, so
# leaving it out of this group would ship a registry nobody can publish into.
server = ["aiohttp>=3.8", "mcap>=1.1", "jsonschema>=4.0"]
# Being a native DDS participant: `sd.participant(...)` beside `sd.connect(...)`.
# cyclonedds is the binding the generated types and every endpoint use; 11.0.1
# is the only version any of the four repositories the native layer replaces
# had tested. mcap is the recording tap's format, and jsonschema validates
# every written sample against the published schema before it reaches the bus.
# Without this extra `import spatialdds` is unchanged, and `sd.participant`
# raises `sd.MissingExtra` naming it.
dds = ["cyclonedds>=11.0.1,<12", "mcap>=1.1", "jsonschema>=4.0"]

[project.scripts]
spatialdds-serve = "spatialdds.serve:main"

[project.urls]
Homepage = "https://github.com/OpenArCloud/spatialdds-web"
Specification = "https://github.com/OpenArCloud/SpatialDDS-spec"

# Found rather than listed: the native layer's generated bindings are a tree
# of subpackages (`spatialdds.dds.types.spatial.core`, ...), and a hand list
# is how one of them would go missing from a wheel.
[tool.setuptools.packages.find]
include = ["spatialdds", "spatialdds.*"]

[tool.setuptools.package-data]
# Everything vendored travels with the package, because the point of 0.2.0 is
# that `pip install` is enough:
#
# * `artifacts/serializer_tables.json` -- what the lift reads, in both
#   directions. A client has no recording to learn the types from.
# * `artifacts/schemas/*.json` -- the 112 generated JSON Schemas. The endpoint
#   publishes them and validates against them, and §8.4's third-party reader
#   has nothing else to go on.
# * `artifacts/idl/**.idl` -- the pinned IDL, the whole v1.8 tree. A registry
#   that starts empty boots its types from this (the tables cannot stand in:
#   they carry no `@key`), and the native layer's bindings are generated from
#   it and its codec models it.
# * `demo/**` -- the fountain set `--demo` serves. Byte-identical to the
#   repository's `samples/` copy, which `tools/pack_demo.py` maintains and
#   `gates/serve_demo.py` checks.
# * `artifacts/openapi.{yaml,html}` -- the REST surface's OpenAPI document and
#   its static reference page, generated by `tools/gen_openapi.py` and served
#   at /.well-known/spatialdds/openapi; `gates/openapi.py` guards the drift.
spatialdds = [
  "artifacts/serializer_tables.json",
  "artifacts/openapi.yaml",
  "artifacts/openapi.html",
  "artifacts/schemas/*.json",
  "artifacts/idl/*.idl",
  "artifacts/idl/provisional/*.idl",
  "demo/*.mcap",
  "demo/manifests/*.json",
  "demo/assets/*",
]
