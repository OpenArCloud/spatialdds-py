            X-SpatialDDS-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                  - $ref: '#/components/schemas/spatial_core_FrameTransform'
                  - $ref: '#/components/schemas/spatial_events_CrossingLine'
                  - $ref: '#/components/schemas/spatial_events_SpatialEvent'
                  - $ref: '#/components/schemas/spatial_events_SpatialZone'
                  - $ref: '#/components/schemas/spatial_owm_ModelPose'
                  - $ref: '#/components/schemas/spatial_semantics_Detection2DSet'
                  - $ref: '#/components/schemas/spatial_semantics_Detection3DSet'
                  - $ref: '#/components/schemas/spatial_semantics_FusedTrackSet'
        '304':
          description: Not modified.
        '401':
          description: An operator-scoped type, without a token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such resource on this endpoint.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: '`rate-limited` -- Too many requests: more requests from one client than its rate allows.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: '`too-many-subscriptions` -- Too many subscriptions: the endpoint''s WebSocket cap is reached.'
