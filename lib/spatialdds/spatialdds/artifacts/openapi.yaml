      description: 'A four-segment topic (`spatialdds/<stream>/<type>/<version>`, no scene), such as the discovery announce lane, served exactly as a scene-scoped collection is: latched set, `ETag`, `304`, the same access classes, and the N.5 stream by upgrading the same path. Read-only: a topic with no scene is in no lane. **The same URL is also a WebSocket** (N.5): connect with `wss://` and receive the latched set as `sample` events, exactly one `end_of_replay` carrying the replay count, then live `sample` and `dispose` events (`{event, topic, key, data | reason}`). Not modelled here; see [Appendix N.5](https://spatialdds.org/v1.8/appendix-n/).'
