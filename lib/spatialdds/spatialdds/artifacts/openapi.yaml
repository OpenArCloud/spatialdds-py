      - {}
      - bearer: []
      responses: &id015
        '200':
          description: As for a scene-scoped topic.
          headers: *id002
          content:
            application/json:
              schema: {}
        '304':
          description: Not modified.
        '401':
          description: An operator-scoped type, without a token.
