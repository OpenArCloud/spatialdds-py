# Publish lib/spatialdds to PyPI by trusted publishing.
#
# Inert as committed. It runs only on a tag matching spatialdds-v*, and even
# then it only succeeds once PyPI has a trusted publisher configured for this
# repository, this workflow filename and this environment. Nothing here holds
# a token: trusted publishing exchanges GitHub's OIDC identity for a
# short-lived upload credential, so there is no API token to leak or rotate.
#
# To release, see deploy/RUNBOOK.md. The gates are not re-run here; a release
# is cut from a commit whose gates already passed, and a workflow that
# re-verified its own artifact would be the self-observing check this
# repository keeps naming.
name: publish spatialdds

on:
  push:
    tags:
      - "spatialdds-v*"
  # Manual runs build the distributions and stop before publishing, which is
  # how you check the artifact without spending a version number.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the wheel and the sdist
        working-directory: lib/spatialdds
        run: |
          python -m pip install --upgrade build
          python -m build
      # The version in the tag and the version in the package have to be the
      # same thing, or the tag points at something that was never released.
      - name: The tag names the version the package declares
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: lib/spatialdds
        run: |
          tag="${GITHUB_REF_NAME#spatialdds-v}"
          pkg="$(python -c 'import re, pathlib; print(re.search(r"__version__ = .([^\"]+).", pathlib.Path("spatialdds/__init__.py").read_text()).group(1))')"
          test "$tag" = "$pkg" || { echo "tag $tag != package $pkg"; exit 1; }
          test -f "dist/spatialdds-$pkg-py3-none-any.whl"
      - uses: actions/upload-artifact@v4
        with:
          name: spatialdds-dist
          path: lib/spatialdds/dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The environment is the second gate: PyPI's trusted publisher is bound to
    # it by name, and a repository setting can require a human to approve.
    environment: pypi
    permissions:
      id-token: write          # the OIDC token trusted publishing exchanges
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spatialdds-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:`. The absence is the mechanism.
